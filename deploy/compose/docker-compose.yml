# Meme Coin Tracker — Docker Compose (self-hosted / VPS)
#
# Prerequisites:
#   1. Copy .env.example → deploy/compose/.env and fill secrets
#   2. Apply Supabase migrations (SQL Editor or supabase db push)
#   3. docker compose up -d --build
#
# Supabase is external. This stack runs API, worker, bot, Mini App.
# Live trading remains OFF regardless of container health.

name: meme-tracker

services:
  api:
    build:
      context: ../../services/api
      dockerfile: ../../deploy/docker/Dockerfile.api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    command: >
      uvicorn meme_tracker.api.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips=*

  worker:
    build:
      context: ../../services/api
      dockerfile: ../../deploy/docker/Dockerfile.api
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    command: python -m meme_tracker.worker.main
    healthcheck:
      # Worker has no HTTP port; process check only
      test: ["CMD-SHELL", "pgrep -f 'meme_tracker.worker' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegram-bot:
    build:
      context: ../../services/api
      dockerfile: ../../deploy/docker/Dockerfile.api
    env_file: .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
    command: python -m meme_tracker.bot.main
    # Bot exits cleanly if TELEGRAM_BOT_TOKEN missing — check logs

  miniapp:
    build:
      context: ../../apps/miniapp
      dockerfile: ../../deploy/docker/Dockerfile.miniapp
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${MINIAPP_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: meme-tracker-net
